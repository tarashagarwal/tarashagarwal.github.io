<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1600" viewBox="0 0 1200 1600" role="img" aria-labelledby="title desc"><title id="title">Eight architecture concepts: a field guide</title><desc id="desc">A concise guide to Kimball modeling, knowledge graphs, ontology, data mesh, Medallion architecture, semantic layers, Lambda architecture, and knowledge distillation, with the design question and artifact for each.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10" fill="#b1c4d9"/></marker></defs>
<rect width="1200" height="1600" rx="12" fill="#090f1b" stroke="none"/>
<text stroke="none" x="65" y="70" fill="#73e8d1" font-family="Consolas,monospace" font-size="18" font-weight="400" text-anchor="start">DATA × PLATFORM × AI</text>
<text stroke="none" x="60" y="150" fill="#ecf4ff" font-family="Arial,Helvetica,sans-serif" font-size="61" font-weight="700" text-anchor="start">Different questions.</text>
<text stroke="none" x="60" y="228" fill="#ecf4ff" font-family="Arial,Helvetica,sans-serif" font-size="61" font-weight="700" text-anchor="start">Connected architecture.</text>
<text stroke="none" x="65" y="295" fill="#b1c4d9" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="400" text-anchor="start">A field guide to eight concepts that can work together.</text>
<path d="M65 343L1135 343" fill="none" stroke="#3a526a" stroke-width="2"/>
<text stroke="none" x="65" y="379" fill="#73e8d1" font-family="Consolas,monospace" font-size="27" font-weight="600" text-anchor="start">01</text>
<text stroke="none" x="145" y="375" fill="#73e8d1" font-family="Arial,Helvetica,sans-serif" font-size="27" font-weight="600" text-anchor="start">Kimball modeling</text>
<text stroke="none" x="145" y="415" fill="#b1c4d9" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" text-anchor="start">Facts, dimensions, declared grain</text>
<text stroke="none" x="685" y="375" fill="#ecf4ff" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="400" text-anchor="start">How do we organize measurements</text>
<text stroke="none" x="685" y="406" fill="#ecf4ff" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="400" text-anchor="start">for understandable analysis?</text>
<path d="M65 476L1135 476" fill="none" stroke="#3a526a" stroke-width="2"/>
<text stroke="none" x="65" y="512" fill="#b6a0f3" font-family="Consolas,monospace" font-size="27" font-weight="600" text-anchor="start">02</text>
<text stroke="none" x="145" y="508" fill="#b6a0f3" font-family="Arial,Helvetica,sans-serif" font-size="27" font-weight="600" text-anchor="start">Knowledge graph</text>
<text stroke="none" x="145" y="548" fill="#b1c4d9" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" text-anchor="start">Identified entities + typed relationships</text>
<text stroke="none" x="685" y="508" fill="#ecf4ff" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="400" text-anchor="start">How are particular business</text>
<text stroke="none" x="685" y="539" fill="#ecf4ff" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="400" text-anchor="start">entities connected?</text>
<path d="M65 609L1135 609" fill="none" stroke="#3a526a" stroke-width="2"/>
<text stroke="none" x="65" y="645" fill="#f2cb87" font-family="Consolas,monospace" font-size="27" font-weight="600" text-anchor="start">03</text>
<text stroke="none" x="145" y="641" fill="#f2cb87" font-family="Arial,Helvetica,sans-serif" font-size="27" font-weight="600" text-anchor="start">Ontology</text>
<text stroke="none" x="145" y="681" fill="#b1c4d9" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" text-anchor="start">Vocabulary + formal semantics</text>
<text stroke="none" x="685" y="641" fill="#ecf4ff" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="400" text-anchor="start">What do entity types and</text>
<text stroke="none" x="685" y="672" fill="#ecf4ff" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="400" text-anchor="start">relationships mean?</text>
<path d="M65 742L1135 742" fill="none" stroke="#3a526a" stroke-width="2"/>
<text stroke="none" x="65" y="778" fill="#73e8d1" font-family="Consolas,monospace" font-size="27" font-weight="600" text-anchor="start">04</text>
<text stroke="none" x="145" y="774" fill="#73e8d1" font-family="Arial,Helvetica,sans-serif" font-size="27" font-weight="600" text-anchor="start">Data mesh</text>
<text stroke="none" x="145" y="814" fill="#b1c4d9" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" text-anchor="start">Domain-owned data products</text>
<text stroke="none" x="685" y="774" fill="#ecf4ff" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="400" text-anchor="start">Who owns the data product,</text>
<text stroke="none" x="685" y="805" fill="#ecf4ff" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="400" text-anchor="start">and how is it governed?</text>
<path d="M65 875L1135 875" fill="none" stroke="#3a526a" stroke-width="2"/>
<text stroke="none" x="65" y="911" fill="#b6a0f3" font-family="Consolas,monospace" font-size="27" font-weight="600" text-anchor="start">05</text>
<text stroke="none" x="145" y="907" fill="#b6a0f3" font-family="Arial,Helvetica,sans-serif" font-size="27" font-weight="600" text-anchor="start">Medallion architecture</text>
<text stroke="none" x="145" y="947" fill="#b1c4d9" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" text-anchor="start">Bronze → silver → gold</text>
<text stroke="none" x="685" y="907" fill="#ecf4ff" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="400" text-anchor="start">How does raw data become</text>
<text stroke="none" x="685" y="938" fill="#ecf4ff" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="400" text-anchor="start">progressively more usable?</text>
<path d="M65 1008L1135 1008" fill="none" stroke="#3a526a" stroke-width="2"/>
<text stroke="none" x="65" y="1044" fill="#f2cb87" font-family="Consolas,monospace" font-size="27" font-weight="600" text-anchor="start">06</text>
<text stroke="none" x="145" y="1040" fill="#f2cb87" font-family="Arial,Helvetica,sans-serif" font-size="27" font-weight="600" text-anchor="start">Semantic layer</text>
<text stroke="none" x="145" y="1080" fill="#b1c4d9" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" text-anchor="start">Shared metric definitions</text>
<text stroke="none" x="685" y="1040" fill="#ecf4ff" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="400" text-anchor="start">How do consumers calculate</text>
<text stroke="none" x="685" y="1071" fill="#ecf4ff" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="400" text-anchor="start">business metrics consistently?</text>
<path d="M65 1141L1135 1141" fill="none" stroke="#3a526a" stroke-width="2"/>
<text stroke="none" x="65" y="1177" fill="#73e8d1" font-family="Consolas,monospace" font-size="27" font-weight="600" text-anchor="start">07</text>
<text stroke="none" x="145" y="1173" fill="#73e8d1" font-family="Arial,Helvetica,sans-serif" font-size="27" font-weight="600" text-anchor="start">Lambda architecture</text>
<text stroke="none" x="145" y="1213" fill="#b1c4d9" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" text-anchor="start">Batch + speed + serving</text>
<text stroke="none" x="685" y="1173" fill="#ecf4ff" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="400" text-anchor="start">How do recomputation and</text>
<text stroke="none" x="685" y="1204" fill="#ecf4ff" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="400" text-anchor="start">recent results coexist?</text>
<path d="M65 1274L1135 1274" fill="none" stroke="#3a526a" stroke-width="2"/>
<text stroke="none" x="65" y="1310" fill="#b6a0f3" font-family="Consolas,monospace" font-size="27" font-weight="600" text-anchor="start">08</text>
<text stroke="none" x="145" y="1306" fill="#b6a0f3" font-family="Arial,Helvetica,sans-serif" font-size="27" font-weight="600" text-anchor="start">Knowledge distillation</text>
<text stroke="none" x="145" y="1346" fill="#b1c4d9" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" text-anchor="start">Trained + evaluated student</text>
<text stroke="none" x="685" y="1306" fill="#ecf4ff" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="400" text-anchor="start">Can a student learn useful</text>
<text stroke="none" x="685" y="1337" fill="#ecf4ff" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="400" text-anchor="start">behavior from a teacher model?</text>
<text stroke="none" x="65" y="1480" fill="#b1c4d9" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="400" text-anchor="start">Choose the problem first. Add the smallest useful capability.</text>
<text stroke="none" x="65" y="1515" fill="#b1c4d9" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="400" text-anchor="start">Make the contracts, ownership, and trade-offs explicit.</text>
<path d="M32 1557L1168 1557" fill="none" stroke="#3a526a" stroke-width="2"/>
<text stroke="none" x="32" y="1581" fill="#b1c4d9" font-family="Consolas,monospace" font-size="10" font-weight="400" text-anchor="start">TARASHAGARWAL.GITHUB.IO / ORIGINAL EXPLANATORY VISUAL</text>
<text stroke="none" x="1168" y="1581" fill="#b1c4d9" font-family="Consolas,monospace" font-size="10" font-weight="400" text-anchor="end">TARASH AGARWAL / OCT 2026</text>
</svg>