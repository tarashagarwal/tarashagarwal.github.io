<svg xmlns="http://www.w3.org/2000/svg" width="900" height="440" viewBox="0 0 900 440" role="img" aria-labelledby="title desc"><title id="title">The disclosure boundary</title><desc id="desc">Preventive review checks content before sending it to the client. Sending it first and deleting it later changes the display but cannot reverse disclosure.</desc>
<defs><linearGradient id="wash" x1="0%" y1="0%" x2="100%" y2="100%"><stop stop-color="#16373e"/><stop offset="1" stop-color="#241c3b"/></linearGradient><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10" fill="#acbed4"/></marker></defs>
<rect width="900" height="440" rx="16" fill="#090f1b"/>
<text stroke="none" x="32" y="43" fill="#ecf4ff" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="700" text-anchor="start">Where does your guardrail run?</text>
<text stroke="none" x="32" y="80" fill="#73e8d1" font-family="Consolas,monospace" font-size="12" font-weight="400" text-anchor="start">PREVENTIVE: REVIEW BEFORE RELEASE</text>
<rect x="32" y="99" width="254" height="83" rx="10" fill="#111e30" stroke="#73e8d1"/>
<text stroke="none" x="48" y="128" fill="#73e8d1" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="600" text-anchor="start">Private draft</text>
<text stroke="none" x="48" y="153" fill="#acbed4" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="400" text-anchor="start">Server only</text>
<path d="M295 140L312 140" fill="none" stroke="#334960" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="322" y="99" width="254" height="83" rx="10" fill="#111e30" stroke="#73e8d1"/>
<text stroke="none" x="338" y="128" fill="#73e8d1" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="600" text-anchor="start">Policy review</text>
<text stroke="none" x="338" y="153" fill="#acbed4" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="400" text-anchor="start">Approve or block</text>
<path d="M585 140L602 140" fill="none" stroke="#334960" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="612" y="99" width="254" height="83" rx="10" fill="#111e30" stroke="#73e8d1"/>
<text stroke="none" x="628" y="128" fill="#73e8d1" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="600" text-anchor="start">User sees text</text>
<text stroke="none" x="628" y="153" fill="#acbed4" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="400" text-anchor="start">After approval</text>
<text stroke="none" x="32" y="222" fill="#f1a5b9" font-family="Consolas,monospace" font-size="12" font-weight="400" text-anchor="start">REACTIVE: PUBLISH, THEN CORRECT</text>
<rect x="32" y="240" width="254" height="83" rx="10" fill="#111e30" stroke="#f1a5b9"/>
<text stroke="none" x="48" y="269" fill="#f1a5b9" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="600" text-anchor="start">Send draft</text>
<text stroke="none" x="48" y="294" fill="#acbed4" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="400" text-anchor="start">Client receives it</text>
<path d="M295 281L312 281" fill="none" stroke="#334960" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="322" y="240" width="254" height="83" rx="10" fill="#111e30" stroke="#f1a5b9"/>
<text stroke="none" x="338" y="269" fill="#f1a5b9" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="600" text-anchor="start">User sees text</text>
<text stroke="none" x="338" y="294" fill="#acbed4" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="400" text-anchor="start">Exposure has occurred</text>
<path d="M585 281L602 281" fill="none" stroke="#334960" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="612" y="240" width="254" height="83" rx="10" fill="#111e30" stroke="#f1a5b9"/>
<text stroke="none" x="628" y="269" fill="#f1a5b9" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="600" text-anchor="start">Reject + remove</text>
<text stroke="none" x="628" y="294" fill="#acbed4" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="400" text-anchor="start">Cannot undo disclosure</text>
<text stroke="none" x="32" y="361" fill="#acbed4" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="400" text-anchor="start">A hidden browser buffer is also on the client side of this boundary.</text>
<path d="M32 395L868 395" fill="none" stroke="#334960" stroke-width="2"/>
<text stroke="none" x="32" y="420" fill="#acbed4" font-family="Consolas,monospace" font-size="11" font-weight="400" text-anchor="start">UI REMOVAL IS A CORRECTION / NOT PREVENTION</text>
<text stroke="none" x="868" y="420" fill="#acbed4" font-family="Consolas,monospace" font-size="10" font-weight="400" text-anchor="end">TARASH AGARWAL / 14 OCT 2026</text>
</svg>