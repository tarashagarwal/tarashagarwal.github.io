<rect x="1000" y="590" width="500" height="126" rx="10" fill="#111e30" stroke="#ecf4ff"/>
<text stroke="none" x="1016" y="629" fill="#ecf4ff" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="600" text-anchor="start">03 / RELEASE</text>
<text stroke="none" x="1016" y="669" fill="#acbed4" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" text-anchor="start">The user can now read the released text.</text>
<text stroke="none" x="1000" y="770" fill="#f1a5b9" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" text-anchor="start">Once disclosed, text cannot be made unseen.</text>
