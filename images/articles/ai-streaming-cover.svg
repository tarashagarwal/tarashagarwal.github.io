<text stroke="none" x="78" y="85" fill="#73e8d1" font-family="Consolas,monospace" font-size="19" font-weight="400" text-anchor="start">PRODUCT × ENGINEERING / CASE STUDY</text>
<text stroke="none" x="72" y="205" fill="#ecf4ff" font-family="Arial,Helvetica,sans-serif" font-size="116" font-weight="700" text-anchor="start">Real-time</text>
<text stroke="none" x="72" y="330" fill="#ecf4ff" font-family="Arial,Helvetica,sans-serif" font-size="116" font-weight="700" text-anchor="start">AI agents.</text>
<text stroke="none" x="78" y="505" fill="#acbed4" font-family="Arial,Helvetica,sans-serif" font-size="38" font-weight="400" text-anchor="start">Speed. Control.</text>
<text stroke="none" x="78" y="558" fill="#acbed4" font-family="Arial,Helvetica,sans-serif" font-size="38" font-weight="400" text-anchor="start">The moment an answer</text>
<text stroke="none" x="78" y="611" fill="#acbed4" font-family="Arial,Helvetica,sans-serif" font-size="38" font-weight="400" text-anchor="start">becomes visible.</text>
<text stroke="none" x="78" y="753" fill="#73e8d1" font-family="Consolas,monospace" font-size="23" font-weight="600" text-anchor="start">STREAM GENERATION.</text>
<text stroke="none" x="78" y="793" fill="#73e8d1" font-family="Consolas,monospace" font-size="23" font-weight="600" text-anchor="start">MAKE PUBLICATION DELIBERATE.</text>
<rect x="1000" y="190" width="500" height="126" rx="10" fill="#111e30" stroke="#b6a0f3"/>
<text stroke="none" x="1016" y="229" fill="#b6a0f3" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="600" text-anchor="start">01 / GENERATE</text>
<text stroke="none" x="1016" y="269" fill="#acbed4" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" text-anchor="start">The provider produces incremental output.</text>
