<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">Real-time AI agents: speed, control, and the publication boundary</title><desc id="desc">Landscape poster for a case study by Tarash Agarwal. Stream generation; make publication a deliberate policy decision. Deleting text later cannot undo exposure.</desc>
