<rect x="1000" y="390" width="500" height="126" rx="10" fill="#111e30" stroke="#73e8d1"/>
<text stroke="none" x="1016" y="429" fill="#73e8d1" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="600" text-anchor="start">02 / REVIEW</text>
<text stroke="none" x="1016" y="469" fill="#acbed4" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" text-anchor="start">Your backend applies its publication policy.</text>
