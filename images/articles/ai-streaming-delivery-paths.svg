<svg xmlns="http://www.w3.org/2000/svg" width="900" height="620" viewBox="0 0 900 620" role="img" aria-labelledby="title desc"><title id="title">One provider stream, three publication policies</title><desc id="desc">An upstream LLM stream enters the trusted backend. The backend chooses full-answer review, provisional forwarding, or reviewed-unit release.</desc>
<defs><linearGradient id="wash" x1="0%" y1="0%" x2="100%" y2="100%"><stop stop-color="#16373e"/><stop offset="1" stop-color="#241c3b"/></linearGradient><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10" fill="#acbed4"/></marker></defs>
<rect width="900" height="620" rx="16" fill="#090f1b"/>
<text stroke="none" x="32" y="43" fill="#ecf4ff" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="700" text-anchor="start">One stream. Three release policies.</text>
<text stroke="none" x="32" y="77" fill="#73e8d1" font-family="Consolas,monospace" font-size="12" font-weight="400" text-anchor="start">GENERATION DOES NOT DECIDE PUBLICATION</text>
<rect x="32" y="111" width="360" height="77" rx="10" fill="#111e30" stroke="#b6a0f3"/>
<text stroke="none" x="48" y="140" fill="#b6a0f3" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="600" text-anchor="start">LLM provider</text>
<text stroke="none" x="48" y="165" fill="#acbed4" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="400" text-anchor="start">Incremental user-facing text deltas</text>
<path d="M408 150L471 150" fill="none" stroke="#334960" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="485" y="111" width="380" height="77" rx="10" fill="#111e30" stroke="#73e8d1"/>
<text stroke="none" x="501" y="140" fill="#73e8d1" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="600" text-anchor="start">Trusted application backend</text>
<text stroke="none" x="501" y="165" fill="#acbed4" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="400" text-anchor="start">Keeps the provider key and review logic</text>
<rect x="32" y="220" width="833" height="94" rx="10" fill="#111e30" stroke="#334960"/>
<text stroke="none" x="52" y="253" fill="#73e8d1" font-family="Consolas,monospace" font-size="21" font-weight="600" text-anchor="start">01</text>
<text stroke="none" x="103" y="250" fill="#73e8d1" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="600" text-anchor="start">FULL-ANSWER REVIEW</text>
<text stroke="none" x="103" y="282" fill="#acbed4" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="400" text-anchor="start">Hold complete draft → review → publish</text>
<text stroke="none" x="838" y="251" fill="#acbed4" font-family="Consolas,monospace" font-size="12" font-weight="400" text-anchor="end">USER</text>
<text stroke="none" x="838" y="282" fill="#ecf4ff" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="400" text-anchor="end">After review</text>
<rect x="32" y="330" width="833" height="94" rx="10" fill="#111e30" stroke="#334960"/>
<text stroke="none" x="52" y="363" fill="#f1a5b9" font-family="Consolas,monospace" font-size="21" font-weight="600" text-anchor="start">02</text>
<text stroke="none" x="103" y="360" fill="#f1a5b9" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="600" text-anchor="start">PROVISIONAL STREAM</text>
<text stroke="none" x="103" y="392" fill="#acbed4" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="400" text-anchor="start">Forward immediately → review later</text>
<text stroke="none" x="838" y="361" fill="#acbed4" font-family="Consolas,monospace" font-size="12" font-weight="400" text-anchor="end">USER</text>
<text stroke="none" x="838" y="392" fill="#ecf4ff" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="400" text-anchor="end">Before final review</text>
<rect x="32" y="440" width="833" height="94" rx="10" fill="#111e30" stroke="#334960"/>
<text stroke="none" x="52" y="473" fill="#b6a0f3" font-family="Consolas,monospace" font-size="21" font-weight="600" text-anchor="start">03</text>
<text stroke="none" x="103" y="470" fill="#b6a0f3" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="600" text-anchor="start">REVIEWED-UNIT STREAM</text>
<text stroke="none" x="103" y="502" fill="#acbed4" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="400" text-anchor="start">Hold unit + context → review → release</text>
<text stroke="none" x="838" y="471" fill="#acbed4" font-family="Consolas,monospace" font-size="12" font-weight="400" text-anchor="end">USER</text>
<text stroke="none" x="838" y="502" fill="#ecf4ff" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="400" text-anchor="end">Unit by unit</text>
<path d="M32 575L868 575" fill="none" stroke="#334960" stroke-width="2"/>
<text stroke="none" x="32" y="600" fill="#acbed4" font-family="Consolas,monospace" font-size="11" font-weight="400" text-anchor="start">ILLUSTRATIVE ARCHITECTURE / ALL THREE CAN RECEIVE A PROVIDER STREAM</text>
<text stroke="none" x="868" y="600" fill="#acbed4" font-family="Consolas,monospace" font-size="10" font-weight="400" text-anchor="end">TARASH AGARWAL / 14 OCT 2026</text>
</svg>