<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" role="img" aria-labelledby="title desc"><title id="title">Murphy’s law for AI agents: plan for the crash after the action</title><desc id="desc">AI agent design example: Booking commits: Stable business operation ID. Worker loses the reply: Chat state is incomplete. Resume + reconcile: Look up the existing result.</desc><rect width="900" height="470" rx="16" fill="#090f1b"/>
