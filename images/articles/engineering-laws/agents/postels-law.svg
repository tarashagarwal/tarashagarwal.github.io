<rect x="234" y="190" width="7" height="8" rx="10" fill="#73e8d1" stroke="#73e8d1"/>
<rect x="247" y="178" width="7" height="20" rx="10" fill="#73e8d1" stroke="#73e8d1"/>
<text x="51" y="235" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#73e8d1" stroke="none" text-anchor="start">Agent proposes</text>
<text x="51" y="258" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#73e8d1" stroke="none" text-anchor="start">arguments</text>
<text x="51" y="292" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#ecf4ff" stroke="none" text-anchor="start">Duplicate amount is</text>
<text x="51" y="312" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#ecf4ff" stroke="none" text-anchor="start">ambiguous</text>
<line x1="291" y1="250" x2="318" y2="250" stroke="#73e8d1" stroke-width="2"/>
<polygon points="318.0,250.0 309.0,254.3 309.0,245.7" fill="#73e8d1"/>
<rect x="324" y="160" width="252" height="173" rx="10" fill="#111e30" stroke="#b6a0f3"/>
<circle cx="353" cy="189" r="13" fill="#111e30" stroke="#b6a0f3" stroke-width="2"/>
<text x="353" y="194" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#b6a0f3" stroke="none" text-anchor="middle">2</text>
<rect x="485" y="174" width="7" height="24" rx="10" fill="#b6a0f3" stroke="#b6a0f3"/>
<rect x="498" y="182" width="7" height="16" rx="10" fill="#b6a0f3" stroke="#b6a0f3"/>
<rect x="511" y="190" width="7" height="8" rx="10" fill="#b6a0f3" stroke="#b6a0f3"/>
<rect x="524" y="178" width="7" height="20" rx="10" fill="#b6a0f3" stroke="#b6a0f3"/>
<rect x="537" y="186" width="7" height="12" rx="10" fill="#b6a0f3" stroke="#b6a0f3"/>
<text x="341" y="235" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#b6a0f3" stroke="none" text-anchor="start">Validate + authorize</text>
<text x="341" y="292" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#ecf4ff" stroke="none" text-anchor="start">Reject invalid or forbidden</text>
<text x="341" y="312" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#ecf4ff" stroke="none" text-anchor="start">calls</text>
<line x1="581" y1="250" x2="608" y2="250" stroke="#73e8d1" stroke-width="2"/>
<polygon points="608.0,250.0 599.0,254.3 599.0,245.7" fill="#73e8d1"/>
