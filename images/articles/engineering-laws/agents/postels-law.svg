<rect x="775" y="182" width="7" height="16" rx="10" fill="#f2cb87" stroke="#f2cb87"/>
<rect x="788" y="190" width="7" height="8" rx="10" fill="#f2cb87" stroke="#f2cb87"/>
<rect x="801" y="178" width="7" height="20" rx="10" fill="#f2cb87" stroke="#f2cb87"/>
<rect x="814" y="186" width="7" height="12" rx="10" fill="#f2cb87" stroke="#f2cb87"/>
<rect x="827" y="174" width="7" height="24" rx="10" fill="#f2cb87" stroke="#f2cb87"/>
<text x="631" y="235" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#f2cb87" stroke="none" text-anchor="start">Execute validated</text>
<text x="631" y="258" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#f2cb87" stroke="none" text-anchor="start">object</text>
<text x="631" y="292" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#ecf4ff" stroke="none" text-anchor="start">One interpretation reaches</text>
<text x="631" y="312" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#ecf4ff" stroke="none" text-anchor="start">the tool</text>
<text x="34" y="369" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#73e8d1" stroke="none" text-anchor="start">DESIGN DECISION</text>
<text x="34" y="395" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#ecf4ff" stroke="none" text-anchor="start">Before connecting an agent to an action, define exactly which input is valid and where enforcement</text>
<text x="34" y="417" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#ecf4ff" stroke="none" text-anchor="start">happens.</text>
<line x1="34" y1="431" x2="866" y2="431" stroke="#3a5165" stroke-width="2"/>
<text x="34" y="452" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#b1c4d9" stroke="none" text-anchor="start">ILLUSTRATIVE SCENARIO  /  Tarash Agarwal  /  AI · PLATFORM · FULL STACK</text>
