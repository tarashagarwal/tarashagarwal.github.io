<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" role="img" aria-labelledby="title desc"><title id="title">Postel’s law for AI agents: validate tool arguments before execution</title><desc id="desc">AI agent design example: Agent proposes arguments: Duplicate amount is ambiguous. Validate + authorize: Reject invalid or forbidden calls. Execute validated object: One interpretation reaches the tool.</desc><rect width="900" height="470" rx="16" fill="#090f1b"/>
<text x="34" y="35" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#73e8d1" stroke="none" text-anchor="start">BEFORE YOU DESIGN AI AGENTS   /   RULE 08</text>
<text x="34" y="78" font-family="Arial, Helvetica, sans-serif" font-size="30" fill="#ecf4ff" stroke="none" text-anchor="start">Postel’s law</text>
<text x="34" y="110" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#b1c4d9" stroke="none" text-anchor="start">validate tool arguments before execution</text>
