<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" role="img" aria-labelledby="title desc"><title id="title">Gall’s law</title><desc id="desc">An agent starts with one user, one authorized data source, and one read-only tool. More tools and tenants arrive after the complete path works and can be observed.</desc>
<rect width="900" height="470" rx="16" fill="#090f1b" stroke="none"/>
<text x="36" y="37" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#73e8d1" stroke="none" text-anchor="start">ENGINEERING LAWS   /   15 OF 20</text>
<text x="36" y="76" font-family="Arial, Helvetica, sans-serif" font-size="29" fill="#ecf4ff" stroke="none" text-anchor="start">Gall’s law</text>
<text x="36" y="104" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#b1c4d9" stroke="none" text-anchor="start">Systems design heuristic</text>
<line x1="36" y1="124" x2="864" y2="124" stroke="#3a5165" stroke-width="2"/>
<rect x="40" y="165" width="240" height="132" rx="10" fill="#111e30" stroke="#73e8d1"/>
<text x="56" y="195" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#73e8d1" stroke="none" text-anchor="start">Working slice</text>
<text x="56" y="224" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#ecf4ff" stroke="none" text-anchor="start">One approved data source</text>
<text x="56" y="248" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#ecf4ff" stroke="none" text-anchor="start">One read-only tool</text>
<text x="56" y="272" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#ecf4ff" stroke="none" text-anchor="start">Identity + access checks</text>
<rect x="330" y="165" width="240" height="132" rx="10" fill="#111e30" stroke="#b6a0f3"/>
<text x="346" y="195" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#b6a0f3" stroke="none" text-anchor="start">Measured extension</text>
<text x="346" y="224" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#ecf4ff" stroke="none" text-anchor="start">Second data source</text>
<text x="346" y="248" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#ecf4ff" stroke="none" text-anchor="start">Evaluate useful answers</text>
<text x="346" y="272" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#ecf4ff" stroke="none" text-anchor="start">Preserve permissions</text>
<rect x="620" y="165" width="240" height="132" rx="10" fill="#111e30" stroke="#f2cb87"/>
<text x="636" y="195" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#f2cb87" stroke="none" text-anchor="start">Controlled action</text>
<text x="636" y="224" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#ecf4ff" stroke="none" text-anchor="start">Scoped write tool</text>
<text x="636" y="248" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#ecf4ff" stroke="none" text-anchor="start">Confirm + audit</text>
<text x="636" y="272" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#ecf4ff" stroke="none" text-anchor="start">Recover from failure</text>
<line x1="280" y1="229" x2="330" y2="229" stroke="#73e8d1" stroke-width="2"/>
<polygon points="330.0,229.0 320.1,233.8 320.1,224.2" fill="#73e8d1" stroke="none"/>
<line x1="570" y1="229" x2="620" y2="229" stroke="#b6a0f3" stroke-width="2"/>
<polygon points="620.0,229.0 610.1,233.8 610.1,224.2" fill="#b6a0f3" stroke="none"/>
<text x="450" y="365" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#ecf4ff" stroke="none" text-anchor="middle">Each increment preserves a complete working path.</text>
<line x1="36" y1="419" x2="864" y2="419" stroke="#3a5165" stroke-width="2"/>
<text x="36" y="445" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#b1c4d9" stroke="none" text-anchor="start">An illustrative evolution path. Simple does not mean omitting essential guarantees.</text>
</svg>
