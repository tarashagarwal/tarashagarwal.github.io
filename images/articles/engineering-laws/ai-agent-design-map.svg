<text x="48" y="389" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#b1c4d9" stroke="none" text-anchor="start">Consistency + memory</text>
<rect x="252" y="333" width="200" height="78" rx="10" fill="#111e30" stroke="#3a5165"/>
<text x="266" y="361" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#73e8d1" stroke="none" text-anchor="start">Budgets</text>
<text x="266" y="389" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#b1c4d9" stroke="none" text-anchor="start">Latency + concurrency</text>
