<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" role="img" aria-labelledby="title desc"><title id="title">20 rules to know before designing AI agents</title><desc id="desc">A user goal reaches an agent loop that plans, acts, and checks results. Tools execute behind validation and authorization. State, budgets, contracts, and recovery support the full workflow.</desc><rect width="900" height="470" rx="16" fill="#090f1b"/>
<text x="34" y="35" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#73e8d1" stroke="none" text-anchor="start">A PRACTICAL FIELD GUIDE  /  20 RULES</text>
<text x="34" y="79" font-family="Arial, Helvetica, sans-serif" font-size="32" fill="#ecf4ff" stroke="none" text-anchor="start">Design the agent. Engineer the system.</text>
<text x="34" y="111" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#b1c4d9" stroke="none" text-anchor="start">The model reasons. Your system owns the execution boundary.</text>
<rect x="34" y="154" width="252" height="142" rx="10" fill="#111e30" stroke="#73e8d1"/>
<text x="52" y="187" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#73e8d1" stroke="none" text-anchor="start">User goal</text>
<text x="52" y="226" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#ecf4ff" stroke="none" text-anchor="start">A useful outcome</text>
<text x="52" y="252" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#ecf4ff" stroke="none" text-anchor="start">A clear finish line</text>
<rect x="324" y="154" width="252" height="142" rx="10" fill="#111e30" stroke="#b6a0f3"/>
<text x="342" y="187" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#b6a0f3" stroke="none" text-anchor="start">Agent loop</text>
<text x="342" y="226" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#ecf4ff" stroke="none" text-anchor="start">Plan → act → observe</text>
<text x="342" y="252" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#ecf4ff" stroke="none" text-anchor="start">Check evidence + progress</text>
<rect x="614" y="154" width="252" height="142" rx="10" fill="#111e30" stroke="#f2cb87"/>
<text x="632" y="187" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#f2cb87" stroke="none" text-anchor="start">Authorized tools</text>
<text x="632" y="226" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#ecf4ff" stroke="none" text-anchor="start">Validate every action</text>
<text x="632" y="252" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#ecf4ff" stroke="none" text-anchor="start">Return authoritative result</text>
