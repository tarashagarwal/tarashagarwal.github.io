<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 350" role="img" aria-labelledby="title desc"><title id="title">Mixed stack boundaries</title><desc id="desc">A core application delegates specific workloads through adapters to independent data services.</desc>
