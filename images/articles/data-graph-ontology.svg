<text stroke="none" x="40" y="427" fill="#b1c4d9" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="400" text-anchor="start">Track source, identity, and time for the claims.</text>
<text stroke="none" x="40" y="456" fill="#b1c4d9" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="400" text-anchor="start">A graph connection is not proof of causality.</text>
<path d="M32 517L868 517" fill="none" stroke="#3a526a" stroke-width="2"/>
<text stroke="none" x="32" y="541" fill="#b1c4d9" font-family="Consolas,monospace" font-size="10" font-weight="400" text-anchor="start">ONTOLOGY DEFINES TERMS / GRAPH STORES STATEMENTS / VALIDATION IS EXPLICIT</text>
<text stroke="none" x="868" y="541" fill="#b1c4d9" font-family="Consolas,monospace" font-size="10" font-weight="400" text-anchor="end">TARASH AGARWAL / OCT 2026</text>
