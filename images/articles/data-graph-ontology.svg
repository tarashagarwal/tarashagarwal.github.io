<svg xmlns="http://www.w3.org/2000/svg" width="900" height="560" viewBox="0 0 900 560" role="img" aria-labelledby="title desc"><title id="title">An ontology and a knowledge graph</title><desc id="desc">The ontology defines classes and relationship vocabulary; the instance graph uses those terms to connect a specific customer, order, line, product, and supplier.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10" fill="#b1c4d9"/></marker></defs>
<rect width="900" height="560" rx="12" fill="#090f1b" stroke="none"/>
<text stroke="none" x="32" y="43" fill="#ecf4ff" font-family="Arial,Helvetica,sans-serif" font-size="27" font-weight="700" text-anchor="start">Meaning above. Particular claims below.</text>
<text stroke="none" x="32" y="76" fill="#73e8d1" font-family="Consolas,monospace" font-size="12" font-weight="400" text-anchor="start">ONTOLOGY ≠ THE INSTANCE DATA / BOTH REQUIRE GOVERNANCE</text>
<rect x="32" y="104" width="833" height="92" rx="8" fill="#111e30" stroke="#b6a0f3"/>
<text stroke="none" x="48" y="134" fill="#b6a0f3" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="600" text-anchor="start">ONTOLOGY / VOCABULARY</text>
<text stroke="none" x="48" y="161" fill="#b1c4d9" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="400" text-anchor="start">Types: Customer · Order · OrderLine · Product · Supplier</text>
<text stroke="none" x="48" y="183" fill="#b1c4d9" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="400" text-anchor="start">Relations: placed · has_line · product · supplied_by</text>
