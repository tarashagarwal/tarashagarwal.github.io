<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 350" role="img" aria-labelledby="title desc"><title id="title">UX task flow</title><desc id="desc">Recognize the starting point, choose a clear action, enter data, receive feedback, and understand completion.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#63f4dd"/></marker></defs>
<rect width="900" height="350" rx="12" fill="#0c182b"/>
<rect x="18" y="100" width="152" height="100" rx="9" fill="#14263d" stroke="#63f4dd" stroke-opacity=".8"/>
<text x="94.0" y="148.0" fill="#63f4dd" font-size="17" font-family="Arial,sans-serif" text-anchor="middle">Recognize</text>
<text x="94.0" y="173.0" fill="#b5c7df" font-size="13" font-family="Arial,sans-serif" text-anchor="middle">Familiar structure</text>
<path d="M171 150L189 150" stroke="#63f4dd" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<rect x="195" y="100" width="152" height="100" rx="9" fill="#14263d" stroke="#a78bfa" stroke-opacity=".8"/>
<text x="271.0" y="148.0" fill="#a78bfa" font-size="17" font-family="Arial,sans-serif" text-anchor="middle">Choose</text>
<text x="271.0" y="173.0" fill="#b5c7df" font-size="13" font-family="Arial,sans-serif" text-anchor="middle">Clear next action</text>
<path d="M348 150L366 150" stroke="#63f4dd" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<rect x="372" y="100" width="152" height="100" rx="9" fill="#14263d" stroke="#63f4dd" stroke-opacity=".8"/>
<text x="448.0" y="148.0" fill="#63f4dd" font-size="17" font-family="Arial,sans-serif" text-anchor="middle">Act</text>
<text x="448.0" y="173.0" fill="#b5c7df" font-size="13" font-family="Arial,sans-serif" text-anchor="middle">Reachable target</text>
<path d="M525 150L543 150" stroke="#63f4dd" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<rect x="549" y="100" width="152" height="100" rx="9" fill="#14263d" stroke="#a78bfa" stroke-opacity=".8"/>
<text x="625.0" y="148.0" fill="#a78bfa" font-size="17" font-family="Arial,sans-serif" text-anchor="middle">Wait</text>
<text x="625.0" y="173.0" fill="#b5c7df" font-size="13" font-family="Arial,sans-serif" text-anchor="middle">Visible progress</text>
<path d="M702 150L720 150" stroke="#63f4dd" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<rect x="726" y="100" width="152" height="100" rx="9" fill="#14263d" stroke="#63f4dd" stroke-opacity=".8"/>
<text x="802.0" y="148.0" fill="#63f4dd" font-size="17" font-family="Arial,sans-serif" text-anchor="middle">Finish</text>
<text x="802.0" y="173.0" fill="#b5c7df" font-size="13" font-family="Arial,sans-serif" text-anchor="middle">Clear outcome</text>
<text x="450" y="266" fill="#b5c7df" font-size="17" font-family="Arial,sans-serif" text-anchor="middle">Test the whole journey with real users and input methods</text>
</svg>