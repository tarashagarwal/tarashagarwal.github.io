<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520" role="img" aria-labelledby="title desc"><title id="title">Lambda architecture and a merge frontier</title><desc id="desc">An event log feeds batch recomputation and a speed path; serving combines the published batch snapshot through frontier F and only the non-overlapping tail after F.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10" fill="#b1c4d9"/></marker></defs>
<rect width="900" height="520" rx="12" fill="#090f1b" stroke="none"/>
<text stroke="none" x="32" y="43" fill="#ecf4ff" font-family="Arial,Helvetica,sans-serif" font-size="27" font-weight="700" text-anchor="start">Fresh results plus a recomputable history.</text>
<text stroke="none" x="32" y="76" fill="#73e8d1" font-family="Consolas,monospace" font-size="12" font-weight="400" text-anchor="start">LAMBDA ARCHITECTURE / DISTINCT FROM AWS LAMBDA</text>
<rect x="32" y="224" width="190" height="86" rx="8" fill="#111e30" stroke="#ecf4ff"/>
<text stroke="none" x="48" y="254" fill="#ecf4ff" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="600" text-anchor="start">EVENT LOG</text>
<text stroke="none" x="48" y="281" fill="#b1c4d9" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="400" text-anchor="start">Retained source events</text>
<rect x="305" y="120" width="245" height="104" rx="8" fill="#111e30" stroke="#b6a0f3"/>
<text stroke="none" x="321" y="150" fill="#b6a0f3" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="600" text-anchor="start">BATCH PATH</text>
<text stroke="none" x="321" y="177" fill="#b1c4d9" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="400" text-anchor="start">Recompute historical view</text>
<text stroke="none" x="321" y="199" fill="#b1c4d9" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="400" text-anchor="start">Publish snapshot through F</text>
<rect x="305" y="317" width="245" height="104" rx="8" fill="#111e30" stroke="#73e8d1"/>
<text stroke="none" x="321" y="347" fill="#73e8d1" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="600" text-anchor="start">SPEED PATH</text>
<text stroke="none" x="321" y="374" fill="#b1c4d9" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="400" text-anchor="start">Incremental recent view</text>
<text stroke="none" x="321" y="396" fill="#b1c4d9" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="400" text-anchor="start">Contribute only tail after F</text>
<path d="M232 260L295 172" fill="none" stroke="#3a526a" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M232 278L295 365" fill="none" stroke="#3a526a" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="662" y="224" width="205" height="104" rx="8" fill="#111e30" stroke="#f2cb87"/>
<text stroke="none" x="678" y="254" fill="#f2cb87" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="600" text-anchor="start">SERVING VIEW</text>
<text stroke="none" x="678" y="281" fill="#b1c4d9" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="400" text-anchor="start">Snapshot + tail</text>
<text stroke="none" x="678" y="303" fill="#b1c4d9" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="400" text-anchor="start">Avoid overlap</text>
<path d="M558 172L652 250" fill="none" stroke="#3a526a" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M558 370L652 300" fill="none" stroke="#3a526a" stroke-width="2" marker-end="url(#arrow)"/>
<text stroke="none" x="32" y="460.0" fill="#b1c4d9" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="400" text-anchor="start">F is a documented input-log frontier; event time alone is not sufficient for late arrivals.</text>
<path d="M32 477L868 477" fill="none" stroke="#3a526a" stroke-width="2"/>
<text stroke="none" x="32" y="501" fill="#b1c4d9" font-family="Consolas,monospace" font-size="10" font-weight="400" text-anchor="start">PUBLISH THE SNAPSHOT AND ADVANCE THE FRONTIER COHERENTLY</text>
<text stroke="none" x="868" y="501" fill="#b1c4d9" font-family="Consolas,monospace" font-size="10" font-weight="400" text-anchor="end">TARASH AGARWAL / OCT 2026</text>
</svg>