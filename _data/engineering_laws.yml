- number: 1
  name: "CAP theorem"
  title: "CAP theorem for AI agents: what happens when shared state splits?"
  kind: "Theorem"
  url: /posts/2026/10/cap-theorem/
  image: /images/articles/engineering-laws/agents/cap-theorem.svg
  image_alt: "AI agent design example: Two agent runs: Competing reservation requests. Partitioned state: Regions cannot coordinate. One booking slot: Confirm only with authority."
  summary: "Before an agent confirms a booking or spends a shared budget, decide what it should do when replicas cannot agree. A confident model response cannot establish that an action committed."
- number: 2
  name: "Little’s law"
  title: "Little’s law for AI agents: size the work in progress"
  kind: "Queueing Relationship"
  url: /posts/2026/10/littles-law/
  image: /images/articles/engineering-laws/agents/littles-law.svg
  image_alt: "AI agent design example: 10 runs / second: Admitted throughput. 5 seconds / run: Average end-to-end time. 50 runs in flight: Average occupancy, not a limit."
  summary: "Ten admitted agent runs per second with five seconds average end-to-end time imply 50 runs in flight on average. Measure the same boundary before sizing queues, workers, and memory."
- number: 3
  name: "Amdahl’s law"
  title: "Amdahl’s law for AI agents: parallelize the independent work"
  kind: "Parallel Speedup Model"
  url: /posts/2026/10/amdahls-law/
  image: /images/articles/engineering-laws/agents/amdahls-law.svg
  image_alt: "AI agent design example: Plan + synthesize: 1 second remains serial. Parallel retrieval: 9 seconds / 8 workers. Ideal total: 2.125 s: Speedup: 10 / 2.125 = 4.71×."
  summary: "Parallel tools only accelerate the part of an agent run that can overlap. Planning, dependent actions, and final synthesis can remain on the critical path."
- number: 4
  name: "Gustafson’s law"
  title: "Gustafson’s law for AI agents: evaluate more within the same deadline"
  kind: "Scaled Speedup Model"
  url: /posts/2026/10/gustafsons-law/
  image: /images/articles/engineering-laws/agents/gustafsons-law.svg
  image_alt: "AI agent design example: One-hour budget: 5% serial preparation. 32 evaluation workers: 95% parallel execution. 30.45× scaled work: Ideal model, excluding overhead."
  summary: "More workers can expand an agent evaluation or research workload within a fixed time budget. That is a different goal from making one unchanged conversation faster."
- number: 5
  name: "Universal scalability law"
  title: "The universal scalability law for AI agents: find the concurrency limit"
  kind: "Scalability Model"
  url: /posts/2026/10/universal-scalability-law/
  image: /images/articles/engineering-laws/agents/universal-scalability-law.svg
  image_alt: "AI agent design example: 8 workers: Model capacity: 6.39×. About 22 workers: Illustrative throughput peak. 64 workers: Model capacity: 6.20×."
  summary: "An agent fleet can slow down as workers compete for shared state and coordination. Measure completed tasks, fit the scaling curve cautiously, and investigate the point where more concurrency stops helping."
- number: 6
  name: "Conway’s law"
  title: "Conway’s law for AI agents: design ownership as carefully as orchestration"
  kind: "Organizational Observation"
  url: /posts/2026/10/conways-law/
  image: /images/articles/engineering-laws/agents/conways-law.svg
  image_alt: "AI agent design example: Product owner: Outcome + conversation. Agent platform: Runtime + traces + identity. Domain-tool owner: Business rules + committed result."
  summary: "An agent crosses product, platform, and domain-tool boundaries. Clear ownership of contracts, permissions, evaluations, and incidents matters as much as the orchestration diagram."
- number: 7
  name: "Hyrum’s law"
  title: "Hyrum’s law for AI agents: tool changes can break learned expectations"
  kind: "Compatibility Observation"
  url: /posts/2026/10/hyrums-law/
  image: /images/articles/engineering-laws/agents/hyrums-law.svg
  image_alt: "AI agent design example: Search tool changes: Newest-first becomes unsorted. Schema still passes: Fields remain unchanged. Agent picks wrong order: Make selection semantics explicit."
  summary: "Prompts and downstream clients can depend on tool ordering, defaults, or error wording. Evaluate existing agent workflows when those observable behaviors change."
- number: 8
  name: "Postel’s law"
  title: "Postel’s law for AI agents: validate tool arguments before execution"
  kind: "Protocol Design Principle"
  url: /posts/2026/10/postels-law/
  image: /images/articles/engineering-laws/agents/postels-law.svg
  image_alt: "AI agent design example: Agent proposes arguments: Duplicate amount is ambiguous. Validate + authorize: Reject invalid or forbidden calls. Execute validated object: One interpretation reaches the tool."
  summary: "Agent-generated arguments need one unambiguous interpretation. Specify supported input, validate it, authorize the action, and execute the same validated object."
- number: 9
  name: "Murphy’s law"
  title: "Murphy’s law for AI agents: plan for the crash after the action"
  kind: "Engineering Aphorism"
  url: /posts/2026/10/murphys-law/
  image: /images/articles/engineering-laws/agents/murphys-law.svg
  image_alt: "AI agent design example: Booking commits: Stable business operation ID. Worker loses the reply: Chat state is incomplete. Resume + reconcile: Look up the existing result."
  summary: "An agent can lose a response after a tool has committed. Design durable operation identities, uncertain-result handling, and recovery before enabling automatic retries."
- number: 10
  name: "Brooks’s law"
  title: "Brooks’s law for AI agents: more builders can overwhelm review"
  kind: "Project Management Observation"
  url: /posts/2026/10/brooks-law/
  image: /images/articles/engineering-laws/agents/brooks-law.svg
  image_alt: "AI agent design example: Many candidate patches: Parallel generation. Shared review queue: Finite reviewer capacity. Verified integration: Accepted changes create progress."
  summary: "Adding people late can increase onboarding and integration work. Parallel coding agents raise a related review-capacity question, but Brooks’s observation does not supply a numerical law for AI productivity."
- number: 11
  name: "Parkinson’s law"
  title: "Parkinson’s law for AI agents: define done before starting the loop"
  kind: "Satirical Management Observation"
  url: /posts/2026/10/parkinsons-law/
  image: /images/articles/engineering-laws/agents/parkinsons-law.svg
  image_alt: "AI agent design example: Bounded task brief: Outcome + tool-call budget. Progress checkpoint: New evidence or repeated work?. Deliver, stop, or ask: Expose partial and uncertain states."
  summary: "Give an agent task a clear outcome, a bounded budget, and a stopping decision. Time limits constrain scope; they do not guarantee correctness or make necessary verification disappear."
- number: 12
  name: "Wirth’s law"
  title: "Wirth’s law for AI agents: stop extra layers consuming every speed gain"
  kind: "Software Efficiency Observation"
  url: /posts/2026/10/wirths-law/
  image: /images/articles/engineering-laws/agents/wirths-law.svg
  image_alt: "AI agent design example: Faster inference: Assume 2× throughput. 3× computation added: Repeated planning + retrieval. End-to-end task slows: Simplified ratio: 3 / 2 = 1.5×."
  summary: "Faster inference can be offset by more model calls, larger context, and redundant retrieval. Measure the full user task and require each added stage to justify its cost."
- number: 13
  name: "Metcalfe’s law"
  title: "Metcalfe’s law for AI agents: useful connections matter more than tool count"
  kind: "Network Value Heuristic"
  url: /posts/2026/10/metcalfes-law/
  image: /images/articles/engineering-laws/agents/metcalfes-law.svg
  image_alt: "AI agent design example: People + expertise: Relevant, active participants. Agent routes the case: Choose an authorized path. Useful collaboration: Measure resolved outcomes."
  summary: "An agent workspace can create valuable connections between people and workflows. Pair counts explain opportunities; they do not prove that adding tools or agents improves capability quadratically."
- number: 14
  name: "Pareto principle"
  title: "The Pareto principle for AI agents: fix the failures your evaluations reveal"
  kind: "Prioritization Heuristic"
  url: /posts/2026/10/pareto-principle/
  image: /images/articles/engineering-laws/agents/pareto-principle.svg
  image_alt: "AI agent design example: 100 failed tasks: Classified evaluation sample. 50 schema + 30 retrieval: 80% from two of five causes. Prioritize + check severity: Rare permission failures still matter."
  summary: "Prioritize agent improvements from measured failure categories. A few causes may dominate, but rare authorization or side-effect failures still deserve attention because severity matters."
- number: 15
  name: "Gall’s law"
  title: "Gall’s law for AI agents: start with one complete, useful workflow"
  kind: "Systems Design Heuristic"
  url: /posts/2026/10/galls-law/
  image: /images/articles/engineering-laws/agents/galls-law.svg
  image_alt: "AI agent design example: One useful workflow: Identity + retrieval + evidence. Measured extension: Add a source; preserve behavior. Controlled action: Authorize + audit + recover."
  summary: "Build one agent workflow that works end to end before adding more tools, tenants, and autonomous actions. Preserve essential permissions, observability, and recovery from the first usable slice."
- number: 16
  name: "The law of leaky abstractions"
  title: "Leaky abstractions in AI agents: trace what the framework hides"
  kind: "Software Design Observation"
  url: /posts/2026/10/leaky-abstractions/
  image: /images/articles/engineering-laws/agents/leaky-abstractions.svg
  image_alt: "AI agent design example: One memory method: Convenient framework interface. 101 hidden queries: Illustrative round trips: 1,010 ms. Trace + load intentionally: Two-query component: 20 ms."
  summary: "A convenient agent API can hide network calls, memory reads, retries, or private events. Trace the underlying behavior when latency, cost, permissions, and publication semantics matter."
- number: 17
  name: "Zawinski’s law"
  title: "Zawinski’s law for AI agents: keep the assistant’s scope deliberate"
  kind: "Humorous Software Observation"
  url: /posts/2026/10/zawinskis-law/
  image: /images/articles/engineering-laws/agents/zawinskis-law.svg
  image_alt: "AI agent design example: Answer reports: Read-only analytics. Send + schedule: Recipients + calendars. Purchase + automate: Spending + durable side effects."
  summary: "A focused assistant can expand into email, scheduling, purchases, and workflow automation. Each capability adds data, permissions, operational duties, and user expectations."
- number: 18
  name: "Reed’s law"
  title: "Reed’s law for AI agents: design useful collaboration groups"
  kind: "Group Network Value Heuristic"
  url: /posts/2026/10/reeds-law/
  image: /images/articles/engineering-laws/agents/reeds-law.svg
  image_alt: "AI agent design example: Launch workspace: Purpose + approved members. Incident workspace: Different audience and tools. Separate shared context: Group count ≠ reasoning quality."
  summary: "An agent workspace can support many human collaboration groups. The possible-group count is combinatorial; it is not a prediction that more autonomous agents produce exponential intelligence."
- number: 19
  name: "Zipf’s law"
  title: "Zipf’s law for AI agents: cache frequent work without leaking context"
  kind: "Empirical Rank-Frequency Pattern"
  url: /posts/2026/10/zipfs-law/
  image: /images/articles/engineering-laws/agents/zipfs-law.svg
  image_alt: "AI agent design example: Repeated questions: Popularity can be highly skewed. Check reuse boundary: Identity + permission + freshness. Cache hit or safe retrieval: Keep long-tail misses reliable."
  summary: "Agent traffic can have repeated questions and a long tail of rare tasks. Measure that skew, protect the miss path, and include permissions and freshness in any reuse decision."
- number: 20
  name: "Fallacies of distributed computing"
  title: "Distributed computing fallacies for AI agents: a tool call is a network operation"
  kind: "Distributed Systems Checklist"
  url: /posts/2026/10/fallacies-of-distributed-computing/
  image: /images/articles/engineering-laws/agents/fallacies-of-distributed-computing.svg
  image_alt: "AI agent design example: Agent requests an order: Stable business operation ID. Order commits; reply lost: Timeout leaves an uncertain result. Reconcile before retry: Return the authoritative outcome."
  summary: "Agent tools inherit network failure, latency, versioning, ownership, and cost. A missing response does not establish that an action failed; explicit uncertainty and reconciliation belong in the runtime."
